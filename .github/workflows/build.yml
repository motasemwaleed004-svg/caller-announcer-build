name: ONLY DOWNLOAD THIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build latest stable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/CallerAnnouncer-LATEST.apk
          ls -lh out/CallerAnnouncer-LATEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallerAnnouncer-LATEST-apk
          path: out/CallerAnnouncer-LATEST.apk
          retention-days: 14
