name: Build Caller Announcer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Write embedded Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .
          cat > settings.gradle.kts <<'__CALLER_ANNOUNCER_FILE__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "CallerAnnouncer"
          include(":app")
          __CALLER_ANNOUNCER_FILE__

          mkdir -p .
          cat > build.gradle.kts <<'__CALLER_ANNOUNCER_FILE__'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          __CALLER_ANNOUNCER_FILE__

          mkdir -p .
          cat > gradle.properties <<'__CALLER_ANNOUNCER_FILE__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          __CALLER_ANNOUNCER_FILE__

          mkdir -p app
          cat > app/build.gradle.kts <<'__CALLER_ANNOUNCER_FILE__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "dev.callerannouncer"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "dev.callerannouncer"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          __CALLER_ANNOUNCER_FILE__

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__CALLER_ANNOUNCER_FILE__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <!-- Required to verify phone state before speaking and for the PHONE_STATE receiver fallback. -->
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
          
              <!-- Required to turn a phone number into a saved contact display name. -->
              <uses-permission android:name="android.permission.READ_CONTACTS" />
          
              <!-- Optional fallback for TelephonyManager.EXTRA_INCOMING_NUMBER. On modern Android this is hard-restricted, so the CallScreeningService role is the primary path. -->
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
          
              <!-- Lets MainActivity ask the user to exempt the app from Doze/App Standby. -->
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          
              <uses-feature
                  android:name="android.hardware.telephony"
                  android:required="false" />
          
              <application
                  android:name=".CallerAnnouncerApp"
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".AnnouncerCallScreeningService"
                      android:permission="android.permission.BIND_SCREENING_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>
                  </service>
          
                  <receiver
                      android:name=".CallReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.PHONE_STATE" />
