name: Build Caller Announcer APK Fixed

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK fixed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract embedded Android project from original workflow
        shell: bash
        run: |
          set -euo pipefail
          git show e0057eb:.github/workflows/build.yml > /tmp/original-build.yml
          awk '
            /      - name: Write embedded Android project/ { found=1; next }
            found && /      - name: Build debug APK/ { exit }
            found && /^        shell: bash/ { next }
            found && /^        run: \|/ { inrun=1; next }
            found && inrun { sub(/^          /, ""); print }
          ' /tmp/original-build.yml > /tmp/write-project.sh
          bash /tmp/write-project.sh
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Apply previous Arabic Franco base fix
        shell: bash
        run: |
          set -euo pipefail
          git show d66f92febbac58fa3fee5d82721a33e48524e8dc:.github/workflows/build-fixed.yml > /tmp/previous-build-fixed.yml
          awk '
            /      - name: Apply repeat-call and Arabic Franco fix/ { found=1; next }
            found && /      - name: Set up Gradle/ { exit }
            found && /^        shell: bash/ { next }
            found && /^        run: \|/ { inrun=1; next }
            found && inrun { sub(/^          /, ""); print }
          ' /tmp/previous-build-fixed.yml > /tmp/apply-base-fix.sh
          bash /tmp/apply-base-fix.sh
          test -f app/src/main/java/dev/callerannouncer/CallerNameNormalizer.kt

      - name: Apply 850ms digit rules and visible-number fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          scheduler = Path('app/src/main/java/dev/callerannouncer/CallerAnnouncementScheduler.kt')
          s = scheduler.read_text()
          s = re.sub(r'private const val ONE_SECOND_MS = \d+L', 'private const val ANNOUNCE_DELAY_MS = 850L', s)
          s = s.replace('ONE_SECOND_MS - elapsed', 'ANNOUNCE_DELAY_MS - elapsed')
          s = re.sub(
              r'(?P<i>\s*)if \(!contactName\.isNullOrBlank\(\)\) \{\s*CallerSpeaker\.speakName\(appContext, contactName\)\s*\}',
              lambda m: (
                  f"{m.group('i')}if (!contactName.isNullOrBlank()) {{\n"
                  f"{m.group('i')}    CallerSpeaker.speakName(appContext, contactName)\n"
                  f"{m.group('i')}}} else {{\n"
                  f"{m.group('i')}    CallerSpeaker.speakDigits(appContext, number)\n"
                  f"{m.group('i')}}}"
              ),
              s,
              count=1,
          )
          scheduler.write_text(s)

          normalizer = Path('app/src/main/java/dev/callerannouncer/CallerNameNormalizer.kt')
          n = normalizer.read_text()
          if '"mo3men" to "مؤمن"' not in n:
              n = n.replace('"mo2men" to "مؤمن",', '"mo2men" to "مؤمن",\n                  "mo3men" to "مؤمن",')
          if 'fun prepareDigits(rawValue: String)' not in n:
              n = n.replace(
                  '\n              private fun convertLatinName(name: String): String {',
                  '''\n              fun prepareDigits(rawValue: String): SpokenCallerName? {
                  val parts = mutableListOf<String>()
                  rawValue.trim().forEachIndexed { index, c ->
                      when {
                          c == '+' && index == 0 -> parts += "plus"
                          c.isDigit() -> parts += c.toString()
                      }
                  }
                  val spoken = parts.joinToString(" ").trim()
                  return if (spoken.isBlank()) null else SpokenCallerName(spoken, Locale.getDefault())
              }

              private fun convertLatinName(name: String): String {'''
              )
          if 'if (token.all { it.isDigit() }) return token' not in n:
              n = re.sub(
                  r'(private fun convertToken\(token: String\): String \{\n)(?P<i>\s*)',
                  r'\1\g<i>if (token.all { it.isDigit() }) return token\n\g<i>',
                  n,
                  count=1,
              )
          normalizer.write_text(n)

          speaker = Path('app/src/main/java/dev/callerannouncer/CallerSpeaker.kt')
          p = speaker.read_text()
          if 'fun speakDigits(context: Context, rawValue: String)' not in p:
              p = p.replace(
                  '\n              fun stop() {',
                  '''\n              fun speakDigits(context: Context, rawValue: String) {
                  val prepared = CallerNameNormalizer.prepareDigits(rawValue) ?: return
                  val appContext = context.applicationContext
                  mainHandler.post {
                      speakPrepared(appContext, prepared, allowRetry = true)
                  }
              }

              fun stop() {''',
                  1,
              )
          speaker.write_text(p)
          PY

          grep -R "ANNOUNCE_DELAY_MS = 850L" app/src/main/java/dev/callerannouncer/CallerAnnouncementScheduler.kt
          grep -R "token.all" app/src/main/java/dev/callerannouncer/CallerNameNormalizer.kt
          grep -R "speakDigits" app/src/main/java/dev/callerannouncer

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/CallerAnnouncer-debug.apk
          ls -lh out/CallerAnnouncer-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallerAnnouncer-debug-apk
          path: out/CallerAnnouncer-debug.apk
          retention-days: 14
