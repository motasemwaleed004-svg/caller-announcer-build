name: Build Caller Announcer APK Fixed

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK fixed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract embedded Android project from old workflow
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /      - name: Write embedded Android project/ { found=1; next }
            found && /      - name: Build debug APK/ { exit }
            found && /^        shell: bash/ { next }
            found && /^        run: \|/ { inrun=1; next }
            found && inrun { sub(/^          /, ""); print }
          ' .github/workflows/build.yml > /tmp/write-project.sh
          bash /tmp/write-project.sh
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Apply repeat-call and Arabic Franco fix
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/dev/callerannouncer/CallerAnnouncementScheduler.kt <<'__CALLER_ANNOUNCER_FILE__'
          package dev.callerannouncer

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.SystemClock
          import android.telephony.TelephonyManager
          import android.util.Log
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.async
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.util.concurrent.atomic.AtomicLong

          object CallerAnnouncementScheduler {
              private const val TAG = "CallerAnnouncement"
              private const val ONE_SECOND_MS = 1000L

              private const val DUPLICATE_SOURCE_WINDOW_MS = 1500L

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private val nextEventId = AtomicLong(0L)
              private val lock = Any()

              private var lastAnnouncementKey: String? = null
              private var lastAnnouncementAt: Long = 0L

              fun schedule(
                  context: Context,
                  incomingNumber: String,
                  source: String,
                  completion: (() -> Unit)? = null
              ) {
                  val appContext = context.applicationContext
                  val number = incomingNumber.trim()
                  if (number.isBlank()) {
                      completion?.invoke()
                      return
                  }
                  if (!PermissionGate.hasRequiredRuntimePermissions(appContext)) {
                      completion?.invoke()
                      return
                  }

                  val key = number
                  val now = SystemClock.elapsedRealtime()
                  synchronized(lock) {
                      if (lastAnnouncementKey == key && now - lastAnnouncementAt < DUPLICATE_SOURCE_WINDOW_MS) {
                          completion?.invoke()
                          return
                      }
                      lastAnnouncementKey = key
                      lastAnnouncementAt = now
                  }

                  val eventId = nextEventId.incrementAndGet()
                  scope.launch {
                      try {
                          Log.d(TAG, "Scheduled caller announcement from $source")
                          val startedAt = SystemClock.elapsedRealtime()
                          val contactNameDeferred = async(Dispatchers.IO) {
                              ContactLookup.displayNameForNumber(appContext, number)
                          }

                          val contactName = contactNameDeferred.await()?.trim()
                          val elapsed = SystemClock.elapsedRealtime() - startedAt
                          val remainingDelay = ONE_SECOND_MS - elapsed
                          if (remainingDelay > 0L) delay(remainingDelay)

                          if (!isStillLatest(eventId, key)) return@launch
                          if (!isStillRinging(appContext)) return@launch

                          if (!contactName.isNullOrBlank()) {
                              CallerSpeaker.speakName(appContext, contactName)
                          }
                      } catch (t: Throwable) {
                          Log.w(TAG, "Caller announcement failed", t)
                      } finally {
                          completion?.invoke()
                      }
                  }
              }

              fun reset() {
                  synchronized(lock) {
                      lastAnnouncementKey = null
                      lastAnnouncementAt = 0L
                      nextEventId.incrementAndGet()
                  }
                  CallerSpeaker.stop()
              }

              private fun isStillLatest(eventId: Long, key: String): Boolean = synchronized(lock) {
                  eventId == nextEventId.get() && lastAnnouncementKey == key
              }

              private fun isStillRinging(context: Context): Boolean {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      context.checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED
                  ) return false

                  val telephonyManager = context.getSystemService(TelephonyManager::class.java) ?: return true
                  return runCatching {
                      @Suppress("DEPRECATION")
                      telephonyManager.callState == TelephonyManager.CALL_STATE_RINGING
                  }.getOrDefault(true)
              }
          }
