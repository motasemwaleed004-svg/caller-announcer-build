              fun prepareForSpeech(rawName: String): SpokenCallerName? {
                  val cleaned = rawName.replace(Regex("\\s+"), " ").trim()
                  if (cleaned.isBlank()) return null

                  if (arabicLetters.containsMatchIn(cleaned)) {
                      return SpokenCallerName(cleaned, arabicLocale)
                  }

                  val fullKey = keyFor(cleaned)
                  exactNames[fullKey]?.let { return SpokenCallerName(it, arabicLocale) }

                  val converted = convertLatinName(cleaned)
                  return if (converted != cleaned) {
                      SpokenCallerName(converted, arabicLocale)
                  } else {
                      SpokenCallerName(cleaned, Locale.getDefault())
                  }
              }

              private fun convertLatinName(name: String): String {
                  var changed = false
                  val converted = latinToken.findAll(name).joinToString(separator = "") { match ->
                      val part = match.value
                      if (part.any { it.isLetterOrDigit() }) {
                          val newPart = convertToken(part)
                          if (newPart != part) changed = true
                          newPart
                      } else {
                          part
                      }
                  }
                  return if (changed) converted else name
              }

              private fun convertToken(token: String): String {
                  exactNames[keyFor(token)]?.let { return it }
                  if (!arabiziMarker.containsMatchIn(token)) return token
                  return arabiziFallback(token)
              }

              private fun keyFor(value: String): String {
                  val normalized = Normalizer.normalize(value, Normalizer.Form.NFD)
                      .replace(Regex("\\p{Mn}+"), "")
                  return normalized.lowercase(Locale.US).replace(Regex("[^a-z0-9]+"), "")
              }

              private fun arabiziFallback(token: String): String {
                  var s = token.lowercase(Locale.US)
                  s = s.replace("3'", "غ")
                      .replace("gh", "غ")
                      .replace("kh", "خ")
                      .replace("sh", "ش")
                      .replace("ch", "ش")
                      .replace("th", "ث")
                      .replace("dh", "ذ")

                  val out = StringBuilder()
                  var index = 0
                  while (index < s.length) {
                      val c = s[index]
                      if (c in '\u0600'..'\u06FF') {
                          out.append(c)
                          index++
                          continue
                      }

                      val next = s.getOrNull(index + 1)
                      when (c) {
                          '2' -> out.append('ء')
                          '3' -> out.append('ع')
                          '5' -> out.append('خ')
                          '6' -> out.append('ط')
                          '7' -> out.append('ح')
                          '8' -> out.append('غ')
                          '9' -> out.append('ص')
                          'a' -> {
                              out.append(if (out.isEmpty()) 'أ' else 'ا')
                              if (next == 'a') index++
                          }
                          'e', 'i', 'y' -> {
                              out.append('ي')
                              if (next == c) index++
                          }
                          'o', 'u', 'w' -> {
                              out.append('و')
                              if (next == c) index++
                          }
                          'b' -> out.append('ب')
                          'p' -> out.append('ب')
                          't' -> out.append('ت')
                          'g', 'j' -> out.append('ج')
                          'd' -> out.append('د')
                          'r' -> out.append('ر')
                          'z' -> out.append('ز')
                          's' -> out.append('س')
                          'f', 'v' -> out.append('ف')
                          'q' -> out.append('ق')
                          'k', 'c' -> out.append('ك')
                          'l' -> out.append('ل')
                          'm' -> out.append('م')
                          'n' -> out.append('ن')
                          'h' -> out.append('ه')
                      }
                      index++
                  }

                  return out.toString().ifBlank { token }
              }
          }
